server:
  port: 18082

spring:
  application:
    name: poc-consumer
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        group: CAREER_POC
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 15
  rabbitmq:
    host: 127.0.0.1
    port: 5674
    username: flowforge
    password: flowforge
    listener:
      simple:
        default-requeue-rejected: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: ${RESUME_PORT:8082}

spring:
  application:
    name: career-resume
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        group: CAREER_PILOT
        enabled: ${NACOS_ENABLED:true}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://localhost:3306/cp_resume?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
  servlet:
    multipart:
      # 与拆分前的单体保持一致：单文件 10 MB，请求体 50 MB（理由见单体 application.yml）
      max-file-size: 10MB
      max-request-size: 50MB
  tomcat:
    max-swallow-size: 50MB
  ai:
    deepseek:
      base-url: https://api.deepseek.com
      # 本服务只走 remote 模式，占位 Key 仅为满足自动配置，不发起本地模型调用
      api-key: ${DEEPSEEK_API_KEY:remote-mode-placeholder}
      chat:
        thinking:
          type: disabled
        options:
          model: deepseek-flash
          temperature: 0.3
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 500ms
        multiplier: 1
        max-interval: 1s
    chat:
      client:
        observations:
          log-prompt: false
          log-completion: false
  http:
    clients:
      connect-timeout: 10s
      read-timeout: 60s

app:
  jwt:
    secret: ${APP_JWT_SECRET:}
    expiration-seconds: 7200
  internal-token:
    ttl-seconds: 300
    audience: career-resume
  ai:
    mode: remote
    structured-max-attempts: 2
  llm:
    encryption-key: ${APP_LLM_ENCRYPTION_KEY:}
    connect-timeout: 10s
    read-timeout: 60s
  resume:
    mode: local
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  file:
    # 与 auth 服务共享同一存储根：简历与头像的路径都相对该目录
    storage-type: ${FILE_STORAGE_TYPE:local}
    storage-root: ${FILE_STORAGE_ROOT:${user.home}/career-pilot-uploads}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"

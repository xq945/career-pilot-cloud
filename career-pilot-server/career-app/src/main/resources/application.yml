server:
  # 阶段 4 起：8081 归 auth 服务，单体（剩余业务）在 8091；直连调试可用 SERVER_PORT 覆盖
  port: ${SERVER_PORT:8091}

spring:
  application:
    name: career-pilot-server
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        group: CAREER_PILOT
        # 无 Nacos 的本地/测试环境可用 NACOS_ENABLED=false 关闭注册
        enabled: ${NACOS_ENABLED:true}

  # 本地开发配置（数据库密码、API Key 等）存放于 application-local.yml，
  # 该文件已被 .gitignore 忽略，不进入仓库。
  # 部署时以外部参数覆盖，例如 --spring.profiles.active=prod
  profiles:
    active: local

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://localhost:3306/career_pilot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  servlet:
    multipart:
      # 单文件上限 10 MB（《系统架构设计》6.1）；头像另有 2 MB 业务级限制。
      # 该检查在**流式读取中**触发：读满 10 MB 即中断，剩余数据不多，可优雅返回 413。
      max-file-size: 10MB
      # 请求体总上限刻意放宽到 50 MB（不是 11MB），原因见下方 tomcat 段：
      # max-request-size 是**基于 Content-Length 的读取前预检查**，一旦触发，
      # 请求体一个字节都没读就被拒绝，连接会被直接切断（浏览器只见网络错误）。
      # 放宽后，10 MB 以上的文件走流式路径，统一由 max-file-size 承接并返回 413。
      max-request-size: 50MB

  tomcat:
    # 请求体被拒时，Tomcat 需"吞掉"（swallow）剩余未读数据才能把 413 响应发完；
    # 超出 swallow 上限则直接断连。默认 2MB 在浏览器上传 10 MB 以上文件时表现为
    # "Failed to fetch"（curl 因已收到响应头看不出该问题，M2 曾据此误判为
    # "不构成问题"——见《问题记录 · 配置与启动》）。与 max-request-size 对齐取 50MB，
    # 保证 ≤50MB 的超限请求都能收到 413/41300 而非连接中断。
    max-swallow-size: 50MB

  ai:
    deepseek:
      base-url: https://api.deepseek.com
      chat:
        # 统一关闭思考模式（《Agent设计》7.2 的关键决策）：
        # 思考模式与 Tool Calling 组合存在强制协议约束，且会使 temperature 失效。
        # 属性路径注意：chat.thinking 是当前写法；chat.options.thinking 已废弃
        # （见配置元数据，其 deprecation.replacement 指向 chat.thinking）。
        thinking:
          type: disabled
        options:
          # 模型名必须显式配置，禁止依赖 Spring AI 默认值
          # （Spring AI 旧版默认值为已退役的 deepseek-chat，见《设计审查报告》P0-3）
          model: deepseek-flash
          # 结构化输出场景宜取低值（《Agent设计》7.1）
          temperature: 0.3
    # 【必须显式配置】Spring AI 的重试默认 max-attempts=10、退避 2000ms × 5 倍递增
    # （见 spring-ai-autoconfigure-retry 的配置元数据），一次读取超时会被重试到分钟级，
    # 与「单次调用读超时 60 秒 + 前端 120 秒」的约定直接冲突。
    # 《Agent设计》8 要求"只对可恢复错误有限重试（建议最多 2 次）"，故取 2 次尝试
    # （1 次初始 + 1 次重试）：最坏 60 + 0.5 + 60 ≈ 121 秒，与前端 120 秒基本对齐。
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 500ms
        multiplier: 1
        max-interval: 1s
    chat:
      client:
        observations:
          # 提示词含简历原文，观测数据一律不记录内容（《系统架构设计》7 节第 7 条）
          log-prompt: false
          log-completion: false
    # 工具调用的框架级兜底（M8 求职智能体）：
    # 产品级的「单次请求 ≤5 次工具调用」上限在 AgentToolCallRecorder 中以中文信封软拦截，
    # 这里刻意放宽到 20 次防失控；越限行为取 RETURN_ERROR_RESPONSE（错误响应交回模型自然收尾）——
    # PoC 实测 THROW 模式下异常不会抛给调用方，`.call()` 会返回英文固定文案
    # （"Total tool call limit (N) exceeded..."），不能作为产品文案来源。
    tools:
      limits:
        max-total-tool-calls: 20
        on-limit-exceeded: RETURN_ERROR_RESPONSE

  # Spring AI 2.0.1 没有自己的 timeout 属性（已核实其配置元数据）：它复用 Spring Boot
  # 自动装配的 RestClient.Builder，超时由下面两项注入（《Agent设计》8：连接 10 秒、读取 60 秒）。
  # 全项目仅 AI 一处出站 HTTP（Tika 为本地解析），全局生效安全。
  # 调小 read-timeout（如 1s）可作为 50200 的构造手段（《测试与验收方案》2.3）。
  http:
    clients:
      connect-timeout: 10s
      read-timeout: 60s

# 敏感配置约定（《系统架构设计》7、9 节）：
# 数据库密码、JWT 密钥、DeepSeek API Key 一律通过环境变量或 application-local.yml
# 注入，本文件不含任何真实凭据。

app:
  jwt:
    # Token 有效期，单位秒，缺省 2 小时（《API接口设计》2 节）
    # 签名密钥 app.jwt.secret 存放在 application-local.yml
    expiration-seconds: 7200
  captcha:
    # 登录图形验证码（M18，《API接口设计》§3.3）。
    # enabled=false 时登录跳过验证码校验——tools/ 下的 30 个脚本（verify 与 e2e）都以
    # /auth/login 取 Token 且看不到图片内容，回归它们时以 APP_CAPTCHA_ENABLED=false 启动。
    enabled: ${APP_CAPTCHA_ENABLED:true}
    # 【仅自动化测试用】非空时所有验证码图片都绘制该固定文本，让脚本能填对答案。
    # 生产必须留空，否则验证码形同虚设（它只改变"画什么字"，校验仍逐字比对、逻辑不变）。
    fixed-text: ${APP_CAPTCHA_FIXED_TEXT:}
    # 有效期（秒）：超期即失效，校验一律返回 40002
    # 验证「过期」路径时用 APP_CAPTCHA_EXPIRE_SECONDS=2 启动（tools/verify/m18-captcha-api.mjs 依赖它）
    expire-seconds: ${APP_CAPTCHA_EXPIRE_SECONDS:300}
    # 本地缓存容量上限（条）：超限先清过期项，仍超限则淘汰最早过期的一条
    max-size: 10000
    # 过期项清理任务的 cron（默认每 5 分钟；cron 简写不可写进 JavaDoc 块注释）
    cleanup-cron: ${APP_CAPTCHA_CLEANUP_CRON:0 */5 * * * *}
  agent:
    # 单次对话总时长预算（《API接口设计》§8.1：总时长不超过 120 秒）。
    # 落地方式为「回合边界的协作式终止」：每个工具执行前检查截止时间，超时则拒绝执行、
    # 让模型基于已有结果收尾（整轮是阻塞调用，无法硬中断在途的 HTTP 读；
    # 在途调用另受 spring.http.clients.read-timeout 约束）。
    # 验证手法：以 --app.agent.total-timeout-millis=1 启动可确定性触发超时截断路径。
    total-timeout-millis: 120000
    # 单次请求工具调用次数上限（《Agent设计》§8：≤5 次），由 AgentToolCallRecorder 软拦截
    max-tool-calls: 5
    # 历史回放上限：只回放 user/assistant 文本消息（不回放工具消息——重建带 tool_calls 的
    # 历史须逐字保真、工具结果是数千 token 的 JSON、且工具返回值是注入载体）
    history-message-limit: 10
    history-char-limit: 6000
    # 注入提示词的资源清单条数上限（只给 ID/名称/分析状态，不给正文）
    catalog-limit: 20
  ai:
    # 阶段 5：业务服务的非工具模型调用交给 career-ai；Agent 工具调用仍走本地
    mode: ${APP_AI_MODE:remote}
    # 结构化输出的总尝试次数（M14）：1 = 不重试；2 = 首次解析失败后追加修复指令重试一次。
    # 只对"输出无法解析"（50201 路径）生效；超时/网络类失败（50200）不重试。
    # 解析失败时另有本地修复（未转义引号）先于重试执行，且不计入尝试次数。
    structured-max-attempts: 2
  resume:
    # 阶段 6b：简历域由 career-resume 服务提供；单体通过 Feign 远程实现访问
    mode: ${APP_RESUME_MODE:remote}
  job:
    # 阶段 6：岗位域由 career-job 服务提供；单体通过 Feign 远程实现访问
    mode: ${APP_JOB_MODE:remote}
  llm:
    # 用户级模型服务（《API接口设计》§3A，M14）：
    # API Key 的加密主密钥（AES-GCM）。缺省时启动打印 WARN 并降级为开发 fallback——
    # 仅限本地开发；演示与部署必须在 application-local.yml / 环境变量中显式配置。
    encryption-key: ${APP_LLM_ENCRYPTION_KEY:}
    # 用户级服务构建 OpenAI 兼容客户端时的超时；与 spring.http.clients 的平台默认对齐，
    # 保证"切换服务"不改变整体超时语义。
    connect-timeout: 10s
    read-timeout: 60s
  schedule:
    # 面试日程的过期流转 cron（M17，默认每小时整点）：
    # PENDING 且面试时间已过 → EXPIRED（仅系统写入，《数据库设计》5.16）。
    # 验证脚本可用 --app.schedule.expiry-cron="*/10 * * * * *" 加速。
    expiry-cron: ${APP_SCHEDULE_EXPIRY_CRON:0 0 * * * *}
  optimization:
    async:
      # 「创建优化」异步链路（M16）：Redis Stream 任务队列 + 卡住任务恢复
      # （《系统架构设计》§6.5）。enabled=false 时走同步执行（与 M11 行为一致）——
      # 无 Redis 环境的回退开关；入队失败时也自动降级为同步执行（§6A.1）。
      # 仅开启时 Redis 才是**启动前置依赖**（连接失败即启动失败，避免任务永不执行的隐性故障）。
      enabled: ${APP_OPTIMIZATION_ASYNC_ENABLED:true}
      redis-address: ${APP_OPTIMIZATION_ASYNC_REDIS_ADDRESS:redis://localhost:6379}
      redis-database: ${APP_OPTIMIZATION_ASYNC_REDIS_DATABASE:0}
      # PENDING 超时（投递丢失判定）——必须大于正常排队时间（消费者单线程，单任务 25–80s）。
      # 30s 会把排队中的正常任务误判为丢投并重复补投（阶段 1 · B3），故提高到 5 分钟。
      pending-timeout: 5m
      # PROCESSING 超时（消费者死亡判定）——必须大于 pending-timeout（启动即校验）
      processing-timeout: 10m
      # 恢复调度扫描间隔
      scan-interval: 60s
      # PROCESSING 超时被自动恢复的最大次数；超过后置 FAILED，避免毒任务无限重跑
      max-recovery-count: 3
  match:
    # 匹配评分规则（《数据库设计》6.1「权重入配置」）：
    # 调整权重或算法时必须手工递增 rule-version，随报告写入 dimension_scores.ruleVersion；
    # 五项权重之和必须为 100、不允许负值，否则应用启动即失败（MatchScoringProperties 构造校验）。
    rule-version: v1
    weights:
      required-skills: 45
      project-relevance: 25
      experience: 15
      education: 10
      preferred-skills: 5
  cors:
    # 开发环境前端来源（《系统架构设计》7.2）；
    # 生产环境与 API 同源部署，届时不应再开放跨域
    allowed-origins: http://localhost:5173
  file:
    # 文件存储实现（《系统架构设计》7.1，M2 定死）：
    #   local = 本地磁盘（缺省；开发与答辩演示使用，不依赖公网）
    #   oss   = 阿里云 OSS（endpoint / bucket / AccessKey 配置见 application-local.yml）
    storage-type: ${FILE_STORAGE_TYPE:local}
    # local 实现的存储根目录，须位于项目运行目录之外；不存在时应用启动即创建
    storage-root: ${FILE_STORAGE_ROOT:${user.home}/career-pilot-uploads}

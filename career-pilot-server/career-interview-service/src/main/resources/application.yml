server:
  port: ${INTERVIEW_PORT:8085}

spring:
  application:
    name: career-interview
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        group: CAREER_PILOT
        enabled: ${NACOS_ENABLED:true}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://localhost:3306/cp_interview?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        # 消费失败重试 3 次（5s / 10s 退避），仍失败则拒绝投递到 DLX/DLQ
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 5s
          multiplier: 2
          max-interval: 1m
        default-requeue-rejected: false
        concurrency: 1
        max-concurrency: 4
  ai:
    deepseek:
      base-url: https://api.deepseek.com
      # 本服务只走 remote 模式，占位 Key 仅为满足自动配置，不发起本地模型调用
      api-key: ${DEEPSEEK_API_KEY:remote-mode-placeholder}
      chat:
        thinking:
          type: disabled
        options:
          model: deepseek-flash
          temperature: 0.3
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 500ms
        multiplier: 1
        max-interval: 1s
    chat:
      client:
        observations:
          log-prompt: false
          log-completion: false
  http:
    clients:
      connect-timeout: 10s
      read-timeout: 60s

app:
  jwt:
    secret: ${APP_JWT_SECRET:}
    expiration-seconds: 7200
  internal-token:
    ttl-seconds: 300
    audience: career-interview
  ai:
    mode: remote
    structured-max-attempts: 2
  llm:
    encryption-key: ${APP_LLM_ENCRYPTION_KEY:}
    connect-timeout: 10s
    read-timeout: 60s
  interview:
    # 本服务持有面试域的实现；单体侧为 remote
    mode: local
    summary:
      # true = 最后一题提交只写 outbox 并立即返回，由 RabbitMQ 消费者生成总评；
      # false = 历史同步路径（回滚开关；同时不装配任何 MQ 拓扑与监听）
      async-enabled: ${APP_INTERVIEW_SUMMARY_ASYNC_ENABLED:true}
    # 事件拓扑（《微服务改造方案》§2.7.2；本地用 dev 前缀，部署时按环境覆盖）
    mq:
      exchange: ${APP_INTERVIEW_MQ_EXCHANGE:cp.dev.topic}
      queue: ${APP_INTERVIEW_MQ_QUEUE:cp.dev.interview.completed.q}
      routing-key: ${APP_INTERVIEW_MQ_ROUTING_KEY:interview.completed}
      dlx: ${APP_INTERVIEW_MQ_DLX:cp.dev.dlx}
      dlq: ${APP_INTERVIEW_MQ_DLQ:cp.dev.interview.completed.dlq}
    outbox:
      scan-interval: ${APP_INTERVIEW_OUTBOX_SCAN_INTERVAL:10s}
  schedule:
    # 日程过期流转（PENDING 且时间已过 → EXPIRED）。多实例同时执行是幂等的：
    # 单条批量条件更新，先到者命中行，后到者影响 0 行。
    expiry-cron: ${APP_SCHEDULE_EXPIRY_CRON:0 0 * * * *}
  resume:
    # 面试服务通过 Feign 访问简历服务（阶段 8 依赖方向 L3 → L2）
    mode: remote
  job:
    mode: remote
  match:
    mode: remote
    # 面试服务不执行匹配；本段仅为被扫描的 MatchScoringService 满足其 fail-fast 构造校验
    rule-version: v1
    weights:
      required-skills: 45
      project-relevance: 25
      experience: 15
      education: 10
      preferred-skills: 5
  optimization:
    async:
      # 面试服务不执行优化任务：关闭后不装配 OptimizationStreamProducer（否则它需要
      # RedisStreamService，而本服务不扫描 infrastructure 包）。任务队列由 career-match 独占。
      enabled: false
  file:
    # 面试链路不读写文件；本配置仅为满足被扫描的 FileStorageProperties（简历域传递依赖）
    storage-type: ${FILE_STORAGE_TYPE:local}
    storage-root: ${FILE_STORAGE_ROOT:${user.home}/career-pilot-uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  pattern:
    level: "%5p [%X{traceId:-}]"

server:
  # 默认 8080；本机被其他项目占用时用 GATEWAY_PORT 覆盖（阶段 3 验证用 18080）
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: career-gateway
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        group: CAREER_PILOT
    gateway:
      server:
        webflux:
          routes:
            - id: career-auth
              uri: lb://career-auth
              predicates:
                - Path=/api/auth/**,/api/user/**
            - id: career-ai
              uri: lb://career-ai
              predicates:
                - Path=/api/llm-providers/**
            - id: career-job
              uri: lb://career-job
              predicates:
                - Path=/api/jobs,/api/jobs/**
            - id: career-resume
              uri: lb://career-resume
              predicates:
                - Path=/api/resumes,/api/resumes/**
            - id: career-match
              uri: lb://career-match
              predicates:
                - Path=/api/matches,/api/matches/**,/api/optimizations,/api/optimizations/**
            - id: career-api
              uri: lb://career-pilot-server
              predicates:
                - Path=/api/**
            - id: career-uploads
              uri: lb://career-pilot-server
              predicates:
                - Path=/uploads/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
                allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
                allowed-headers: "Authorization,Content-Type"
                max-age: 3600

# 与单体共享用户 JWT 密钥；内部令牌密钥缺省由它派生（见 InternalTokenService）
app:
  jwt:
    secret: ${APP_JWT_SECRET:}
  internal-token:
    ttl-seconds: 300
    audience: career-pilot-server

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

server:
  port: ${AI_PORT:8087}

spring:
  application:
    name: career-ai
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        group: CAREER_PILOT
        enabled: ${NACOS_ENABLED:true}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 阶段 5 临时共享 career_pilot.llm_provider；Agent 拆分后迁到 cp_ai
    url: "jdbc:mysql://localhost:3306/career_pilot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
  ai:
    deepseek:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        thinking:
          type: disabled
        options:
          model: deepseek-flash
          temperature: 0.3
    retry:
      max-attempts: 2
      backoff:
        initial-interval: 500ms
        multiplier: 1
        max-interval: 1s
    chat:
      client:
        observations:
          log-prompt: false
          log-completion: false
  http:
    clients:
      connect-timeout: 10s
      read-timeout: 60s

app:
  jwt:
    secret: ${APP_JWT_SECRET:}
    expiration-seconds: 7200
  internal-token:
    ttl-seconds: 300
    audience: career-ai
  ai:
    mode: local
    structured-max-attempts: 2
  llm:
    encryption-key: ${APP_LLM_ENCRYPTION_KEY:}
    connect-timeout: 10s
    read-timeout: 60s
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info
